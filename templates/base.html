<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HMS Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #111827;
            --main-bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-primary);
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: 1fr;
            height: 100vh;
        }
        .sidebar {
            background-color: var(--sidebar-bg);
            padding: 1.5rem;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 2rem;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #d1d5db;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: background-color 0.2s, color 0.2s;
        }
        .sidebar-nav a:hover {
            background-color: #374151;
            color: white;
        }
        .sidebar-nav a.active {
            background-color: var(--accent-blue);
            color: white;
        }
        .sidebar-footer {
            margin-top: auto;
        }
        .main-content {
            padding: 2rem;
            overflow-y: auto;
        }
        h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 2rem; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table thead th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }
        .table tbody td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-blue);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--accent-blue-hover); }
        .btn-success { background-color: #10b981; }
        .btn-success:hover { background-color: #059669; }
        .flash {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            color: white;
        }
        .flash.success { background-color: #10b981; }
        .flash.error { background-color: #ef4444; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div>
            <div class="sidebar-header">HMS</div>
            <div class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}"><i class="fa-solid fa-table-columns fa-fw"></i> Dashboard</a>
                <a href="{{ url_for('manage_doctors') }}" class="{{ 'active' if request.endpoint == 'manage_doctors' else '' }}"><i class="fa-solid fa-user-doctor fa-fw"></i> Doctors</a>
                <a href="{{ url_for('manage_staff') }}" class="{{ 'active' if request.endpoint == 'manage_staff' else '' }}"><i class="fa-solid fa-users fa-fw"></i> Staff</a>
                <a href="{{ url_for('view_reports') }}" class="{{ 'active' if request.endpoint == 'view_reports' else '' }}"><i class="fa-solid fa-chart-pie fa-fw"></i> Reports</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket fa-fw"></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>

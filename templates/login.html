<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HMS Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-house-medical"></i>
            <h2>HMS Portal</h2>
            <p>Hospital Management System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}" style="margin-bottom: 1.5rem;">
                  <i class="fa-solid fa-circle-exclamation"></i>
                  <span>{{ message }}</span>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user mr-2"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autocomplete="off">
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password"><i class="fa-solid fa-lock mr-2"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; padding: 1rem;">
                <span>Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 2rem;">
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                Don't have an account? 
                <a href="{{ url_for('register') }}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
